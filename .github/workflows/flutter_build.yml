name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true
      build_type:
        description: "release atau debug"
        required: false
        default: "release"

run-name: flutter-build-${{ inputs.build_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q "builds/${{ inputs.build_id }}.zip" -d project
          # Kalau hasil unzip punya 1 folder pembungkus, masuk ke dalamnya
          if [ "$(ls -1 project | wc -l)" = "1" ] && [ -d "project/$(ls -1 project)" ]; then
            mv "project/$(ls -1 project)"/* project/ 2>/dev/null || true
          fi

      - name: Flutter pub get
        working-directory: project
        run: flutter pub get

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release --no-tree-shake-icons
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find project/build/app/outputs/flutter-apk -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1

      - name: Cleanup build zip from repo
        if: always()
        run: |
          git config user.name "web2apk-bot"
          git config user.email "bot@web2apk.local"
          git rm -f "builds/${{ inputs.build_id }}.zip" || true
          git commit -m "chore: cleanup build ${{ inputs.build_id }}" || true
          git push || true
