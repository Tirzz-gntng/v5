name: Build Android ZIP APK

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build ID"
        required: true
      build_type:
        description: "release atau debug"
        required: false
        default: "debug"

run-name: androidzip-build-${{ inputs.build_id }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Unzip project
        run: |
          mkdir -p project
          unzip -q "builds/${{ inputs.build_id }}.zip" -d project
          if [ "$(ls -1 project | wc -l)" = "1" ] && [ -d "project/$(ls -1 project)" ]; then
            mv "project/$(ls -1 project)"/* project/ 2>/dev/null || true
          fi

      - name: Make gradlew executable
        run: chmod +x project/gradlew

      - name: Build APK
        working-directory: project
        run: |
          if [ "${{ inputs.build_type }}" = "release" ]; then
            ./gradlew assembleRelease --no-daemon --stacktrace
          else
            ./gradlew assembleDebug --no-daemon --stacktrace
          fi

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find project -path "*/outputs/apk/*" -name "*.apk" | head -n 1)
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ inputs.build_id }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 1

      - name: Cleanup build zip from repo
        if: always()
        run: |
          git config user.name "web2apk-bot"
          git config user.email "bot@web2apk.local"
          git rm -f "builds/${{ inputs.build_id }}.zip" || true
          git commit -m "chore: cleanup build ${{ inputs.build_id }}" || true
          git push || true
