name: Flutter Build APK

# Workflow build APK Flutter dari ZIP project yang di-upload bot
# ke Release. Dipicu via workflow_dispatch oleh bot (server.js).

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag release tempat ZIP project berada"
        required: true
        type: string
      build_type:
        description: "Tipe build APK"
        required: true
        type: choice
        options:
          - release
          - debug

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17 (Zulu)
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      # Versi Flutter stable TERBARU (sesuai kebutuhan: selalu up-to-date)
      - name: Setup Flutter (stable terbaru)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Download ZIP project dari Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Release yang baru dibuat bot kadang belum terbaca oleh API —
          # makanya dicoba ulang beberapa kali sebelum nyerah.
          ZIP_URL=""
          for i in 1 2 3 4 5 6; do
            curl -sL -H "Authorization: token $GH_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/releases/tags/${{ inputs.tag }}" \
              -o release.json
            ZIP_URL=$(jq -r '.assets[0].url' release.json)
            if [ -n "$ZIP_URL" ] && [ "$ZIP_URL" != "null" ]; then
              break
            fi
            echo "Percobaan $i/6: asset release belum terlihat, tunggu 5 detik..."
            sleep 5
          done
          if [ -z "$ZIP_URL" ] || [ "$ZIP_URL" = "null" ]; then
            echo "::error::Asset ZIP tidak ditemukan pada release ${{ inputs.tag }}"
            exit 1
          fi
          # Unduh asset ZIP (retry 3x)
          ok=0
          for i in 1 2 3; do
            if curl -sfL -H "Authorization: token $GH_TOKEN" \
              -H "Accept: application/octet-stream" \
              "$ZIP_URL" -o project.zip && [ -s project.zip ]; then
              ok=1
              break
            fi
            echo "Percobaan $i/3: unduh asset gagal, tunggu 5 detik..."
            rm -f project.zip
            sleep 5
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Gagal mengunduh asset ZIP dari release ${{ inputs.tag }}"
            exit 1
          fi
          echo "ZIP size: $(du -h project.zip | cut -f1)"

          # Ekstrak + ratakan jika ZIP punya satu folder root
          rm -rf extracted project
          mkdir -p extracted project
          unzip -q project.zip -d extracted
          DIRS=$(find extracted -mindepth 1 -maxdepth 1 -type d | wc -l)
          FILES=$(find extracted -mindepth 1 -maxdepth 1 -type f | wc -l)
          if [ "$DIRS" -eq 1 ] && [ "$FILES" -eq 0 ]; then
            INNER=$(find extracted -mindepth 1 -maxdepth 1 -type d | head -n1)
            mv "$INNER"/* ./project/ || true
            cp -a "$INNER"/.[!.]* ./project/ 2>/dev/null || true
          else
            mv extracted/* ./project/ || true
            cp -a extracted/.[!.]* ./project/ 2>/dev/null || true
          fi
          echo "=== Isi folder project ==="
          ls -la ./project

      - name: Siapkan project Flutter
        working-directory: ./project
        run: |
          set -e
          flutter config --no-analytics
          # Jika project tidak punya folder android (mis. hanya lib/ + pubspec.yaml),
          # generate platform Android otomatis.
          if [ ! -d "android" ]; then
            PROJECT_NAME=$(grep -m1 '^name:' pubspec.yaml | awk '{print $2}' | tr -d ' ' || echo "app")
            if [ -z "$PROJECT_NAME" ]; then PROJECT_NAME="app"; fi
            echo "Folder android tidak ada → flutter create --project-name $PROJECT_NAME"
            flutter create . --platforms android --project-name "$PROJECT_NAME"
          fi
          flutter pub get

      # Flutter stable terbaru menaikkan syarat Gradle / AGP / Kotlin —
      # project lama otomatis disesuaikan sebelum build (tanpa mengubah project user).
      - name: Patch Gradle, AGP & Kotlin (sesuaikan Flutter terbaru)
        working-directory: ./project
        run: |
          set -e

          # ── (1) Versi MINIMUM yang diminta Flutter yang terpasang ──
          FLUTTER_ROOT="$(dirname "$(dirname "$(command -v flutter)")")"
          CHK="$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/DependencyVersionChecker.kt"
          flutter_min() {
            if [ -f "$CHK" ]; then
              V=$(grep -oE "$1[^=]*= *(AndroidPlugin)?Version\([0-9]+, *[0-9]+, *[0-9]+\)" "$CHK" 2>/dev/null | head -n1 | grep -oE "\([0-9]+, *[0-9]+, *[0-9]+\)" | tr -d '()' | awk -F', *' '{print $1"."$2"."$3}')
              if [ -n "$V" ]; then echo "$V"; return; fi
            fi
            echo "$2"
          }
          MIN_GRADLE=$(flutter_min errorGradleVersion "8.14.0")
          MIN_AGP=$(flutter_min errorAGPVersion "8.11.1")
          MIN_KGP=$(flutter_min errorKGPVersion "2.1.0")

          # ── (2) Versi TERBARU per jalur mayor (stabil, tanpa alpha/beta/rc) ──
          maven_latest() {
            curl -sL --max-time 20 "$1" | grep -oE '<version>[0-9][0-9.]*</version>' \
              | sed 's/<[^>]*>//g' | grep -E "^$2" | sort -V | tail -n1
          }
          AGP8=$(maven_latest "https://dl.google.com/android/maven2/com/android/application/com.android.application.gradle.plugin/maven-metadata.xml" "8\.")
          KOT2=$(maven_latest "https://repo1.maven.org/maven2/org/jetbrains/kotlin/kotlin-gradle-plugin/maven-metadata.xml" "2\.")
          LATEST8=$(curl -sL --max-time 15 https://services.gradle.org/versions/all \
            | jq -r '[.[] | select((.snapshot // false) == false and (.nightly // false) == false and ((.rcFor // "") == "") and ((.broken // false) == false) and (.version | startswith("8.")))][0].version // empty' 2>/dev/null || true)

          maxv() { printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1; }
          TARGET_GRADLE=$(maxv "${LATEST8:-8.14.3}" "$MIN_GRADLE")
          TARGET_AGP=$(maxv "${AGP8:-8.11.1}" "$MIN_AGP")
          TARGET_KOT=$(maxv "${KOT2:-2.1.0}" "$MIN_KGP")
          echo "Target: Gradle $TARGET_GRADLE | AGP $TARGET_AGP | Kotlin $TARGET_KOT"
          echo "(minimum Flutter: $MIN_GRADLE / $MIN_AGP / $MIN_KGP)"

          # ── (3) Patch gradle-wrapper.properties (semua yang ditemukan) ──
          PROPS=$(find . -path "*/gradle/wrapper/gradle-wrapper.properties" -not -path "*/build/*" 2>/dev/null || true)
          if [ -z "$PROPS" ]; then
            echo "Tidak ada gradle-wrapper.properties → lewati patch wrapper"
          else
            while IFS= read -r PROP; do
              CUR=$(grep -oE 'gradle-[0-9]+(\.[0-9]+)*' "$PROP" | head -n1 | sed 's/^gradle-//' || true)
              if [ -z "$CUR" ]; then
                echo "$PROP: distributionUrl tidak terbaca → set langsung ke $TARGET_GRADLE"
                sed -i "s#^distributionUrl=.*#distributionUrl=https://services.gradle.org/distributions/gradle-${TARGET_GRADLE}-bin.zip#" "$PROP"
                continue
              fi
              LOW=$(printf '%s\n%s\n' "$CUR" "$TARGET_GRADLE" | sort -V | head -n1)
              if [ "$LOW" != "$TARGET_GRADLE" ]; then
                sed -i -E "s#gradle-[0-9]+(\.[0-9]+)*-(all|bin)\.zip#gradle-${TARGET_GRADLE}-bin.zip#" "$PROP"
                echo "$PROP: Gradle $CUR → $TARGET_GRADLE"
              else
                echo "$PROP: Gradle $CUR sudah memenuhi syarat (target >= $TARGET_GRADLE)"
              fi
            done <<< "$PROPS"
          fi

          # ── (4) Patch AGP & Kotlin (settings/build gradle, groovy & kts) ──
          patch_file() {
            F="$1"
            CUR_AGP=$(grep -hoE "(com\.android\.(application|library)[\"']?\)?[[:space:]]*,?[[:space:]]*version[[:space:]]*[\"'][0-9][0-9.]*|com\.android\.tools\.build:gradle:[0-9][0-9.]*)" "$F" 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | sort -u | tail -n1)
            if [ -n "$CUR_AGP" ]; then
              LOW=$(printf '%s\n%s\n' "$CUR_AGP" "$TARGET_AGP" | sort -V | head -n1)
              if [ "$LOW" != "$TARGET_AGP" ]; then
                perl -pi -e "s/(com\\.android\\.application[\"']?\\)?\\s*,?\\s*version\\s*[\"'])[0-9][0-9.]*/\${1}$TARGET_AGP/g; s/(com\\.android\\.library[\"']?\\)?\\s*,?\\s*version\\s*[\"'])[0-9][0-9.]*/\${1}$TARGET_AGP/g; s/(com\\.android\\.tools\\.build:gradle:)[0-9][0-9.]*/\${1}$TARGET_AGP/g" "$F"
                echo "$F: AGP $CUR_AGP → $TARGET_AGP"
              else
                echo "$F: AGP $CUR_AGP sudah cukup (target $TARGET_AGP)"
              fi
            fi
            CUR_KOT=$(grep -hoE "org\.jetbrains\.kotlin(\.[A-Za-z0-9_]+)?[\"']?\)?[[:space:]]*,?[[:space:]]*version[[:space:]]*[\"'][0-9][0-9.]*|org\.jetbrains\.kotlin:kotlin-gradle-plugin:[0-9][0-9.]*" "$F" 2>/dev/null | grep -oE "[0-9]+\.[0-9]+(\.[0-9]+)?" | sort -u | tail -n1)
            if [ -n "$CUR_KOT" ]; then
              LOW=$(printf '%s\n%s\n' "$CUR_KOT" "$TARGET_KOT" | sort -V | head -n1)
              if [ "$LOW" != "$TARGET_KOT" ]; then
                perl -pi -e "s/(org\\.jetbrains\\.kotlin(?:\\.[A-Za-z0-9_]+)?[\"']?\\)?\\s*,?\\s*version\\s*[\"'])[0-9][0-9.]*/\${1}$TARGET_KOT/g; s/(org\\.jetbrains\\.kotlin:kotlin-gradle-plugin:)[0-9][0-9.]*/\${1}$TARGET_KOT/g" "$F"
                echo "$F: Kotlin $CUR_KOT → $TARGET_KOT"
              else
                echo "$F: Kotlin $CUR_KOT sudah cukup (target $TARGET_KOT)"
              fi
            fi
          }
          AGPFILES=$(find . \( -name "*.gradle" -o -name "*.gradle.kts" \) -not -path "*/build/*" -not -path "*/.dart_tool/*" 2>/dev/null || true)
          if [ -n "$AGPFILES" ]; then
            while IFS= read -r F; do patch_file "$F"; done <<< "$AGPFILES"
          else
            echo "Tidak ada file gradle (project tanpa folder android) → lewati patch AGP/Kotlin"
          fi
          exit 0

      - name: Build APK
        working-directory: ./project
        run: |
          set -e
          chmod +x android/gradlew || true
          if [ "${{ inputs.build_type }}" = "debug" ]; then
            flutter build apk --debug
          else
            flutter build apk --release
          fi
          echo "=== Hasil build ==="
          ls -la build/app/outputs/flutter-apk/ || true

      - name: Upload artifact APK
        uses: actions/upload-artifact@v4
        with:
          name: build-apk
          path: project/build/app/outputs/flutter-apk/*.apk
          retention-days: 3
          if-no-files-found: error
