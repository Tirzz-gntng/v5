name: Web2APK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Unique run tag from bot'
        required: true
      web_url:
        description: 'URL Website'
        required: true
      app_name:
        description: 'Nama Aplikasi'
        required: true
      icon_url:
        description: 'Icon Url'
        required: true

run-name: ${{ inputs.tag }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true

      - name: Create Flutter Project
        run: |
          set -e
          APP_NAME="${{ github.event.inputs.app_name }}"
          PKG=$(echo "$APP_NAME" | tr '[:upper:]' '[:lower:]' | tr ' ' '_' | tr -cd '[:alnum:]_' | cut -c1-40)
          if [ -z "$PKG" ]; then
            PKG="webapp"
          fi
          echo "Project name: $PKG"
          flutter create --org com.webapk --project-name "$PKG" --platforms=android myapp
          cd myapp
          flutter pub get

      - name: Add Dependencies
        run: |
          set -e
          cd myapp
          flutter pub add webview_flutter
          flutter pub add flutter_launcher_icons
          flutter pub add connectivity_plus
          flutter pub get

      - name: Configure pubspec assets
        run: |
          set -e
          cd myapp
          if grep -q "assets:" pubspec.yaml; then
            if ! grep -q "assets/icon/" pubspec.yaml; then
              sed -i '/assets:/a\    - assets/icon/' pubspec.yaml
            fi
          else
            cat >> pubspec.yaml << 'EOF'

  assets:
    - assets/icon/
EOF
          fi
          tail -20 pubspec.yaml

      - name: Write main.dart
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
          WEB_URL: ${{ github.event.inputs.web_url }}
        run: |
          set -e
          APP_NAME_ESC=$(printf '%s' "$APP_NAME" | sed "s/'/\\\\'/g")
          WEB_URL_ESC=$(printf '%s' "$WEB_URL" | sed "s/'/\\\\'/g")

          cat > myapp/lib/main.dart << DART
          import 'package:flutter/material.dart';
          import 'package:flutter/services.dart';
          import 'package:webview_flutter/webview_flutter.dart';
          import 'package:connectivity_plus/connectivity_plus.dart';
          import 'dart:async';

          void main() {
            WidgetsFlutterBinding.ensureInitialized();
            SystemChrome.setSystemUIOverlayStyle(const SystemUiOverlayStyle(
              statusBarColor: Colors.transparent,
              statusBarIconBrightness: Brightness.dark,
            ));
            runApp(const MyApp());
          }

          class MyApp extends StatelessWidget {
            const MyApp({super.key});
            @override
            Widget build(BuildContext context) {
              return MaterialApp(
                title: '$APP_NAME_ESC',
                debugShowCheckedModeBanner: false,
                theme: ThemeData(
                  useMaterial3: true,
                  colorScheme: ColorScheme.fromSeed(seedColor: Colors.blue),
                ),
                home: const SplashScreen(),
              );
            }
          }

          class SplashScreen extends StatefulWidget {
            const SplashScreen({super.key});
            @override
            State<SplashScreen> createState() => _SplashScreenState();
          }

          class _SplashScreenState extends State<SplashScreen>
              with TickerProviderStateMixin {
            late AnimationController _fadeController;
            late AnimationController _scaleController;
            late AnimationController _dotController;
            late Animation<double> _fadeAnim;
            late Animation<double> _scaleAnim;
            late Animation<double> _dot1Anim;
            late Animation<double> _dot2Anim;
            late Animation<double> _dot3Anim;

            bool _isChecking = false;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();

              _fadeController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );
              _scaleController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 800),
              );
              _dotController = AnimationController(
                vsync: this,
                duration: const Duration(milliseconds: 1200),
              )..repeat();

              _fadeAnim = Tween<double>(begin: 0.0, end: 1.0).animate(
                CurvedAnimation(parent: _fadeController, curve: Curves.easeIn),
              );
              _scaleAnim = Tween<double>(begin: 0.6, end: 1.0).animate(
                CurvedAnimation(parent: _scaleController, curve: Curves.elasticOut),
              );
              _dot1Anim = Tween<double>(begin: 0.4, end: 1.0).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: const Interval(0.0, 0.6, curve: Curves.easeInOut),
                ),
              );
              _dot2Anim = Tween<double>(begin: 0.4, end: 1.0).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: const Interval(0.2, 0.8, curve: Curves.easeInOut),
                ),
              );
              _dot3Anim = Tween<double>(begin: 0.4, end: 1.0).animate(
                CurvedAnimation(
                  parent: _dotController,
                  curve: const Interval(0.4, 1.0, curve: Curves.easeInOut),
                ),
              );

              _fadeController.forward();
              _scaleController.forward();
              _checkConnectivityAndNavigate();
            }

            @override
            void dispose() {
              _fadeController.dispose();
              _scaleController.dispose();
              _dotController.dispose();
              super.dispose();
            }

            Future<void> _checkConnectivityAndNavigate() async {
              if (_isChecking) return;
              setState(() {
                _isChecking = true;
              });

              await Future.delayed(const Duration(milliseconds: 1200));

              final connectivityResult = await Connectivity().checkConnectivity();
              if (connectivityResult.every((r) => r == ConnectivityResult.none)) {
                setState(() {
                  _isChecking = false;
                });
                _showNoConnectionDialog();
              } else {
                if (mounted) {
                  Navigator.pushReplacement(
                    context,
                    PageRouteBuilder(
                      transitionDuration: const Duration(milliseconds: 500),
                      pageBuilder: (_, __, ___) => const WebViewPage(),
                      transitionsBuilder: (_, anim, __, child) =>
                          FadeTransition(opacity: anim, child: child),
                    ),
                  );
                }
              }
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() {
                _dialogShown = true;
              });
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Tidak ada koneksi internet. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        setState(() {
                          _dialogShown = false;
                          _isChecking = false;
                        });
                        _checkConnectivityAndNavigate();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            Widget _buildDot(Animation<double> anim, Color color) {
              return FadeTransition(
                opacity: anim,
                child: ScaleTransition(
                  scale: anim,
                  child: Container(
                    width: 12,
                    height: 12,
                    margin: const EdgeInsets.symmetric(horizontal: 4),
                    decoration: BoxDecoration(
                      color: color,
                      shape: BoxShape.circle,
                    ),
                  ),
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return Scaffold(
                backgroundColor: Colors.white,
                body: Center(
                  child: FadeTransition(
                    opacity: _fadeAnim,
                    child: ScaleTransition(
                      scale: _scaleAnim,
                      child: Column(
                        mainAxisAlignment: MainAxisAlignment.center,
                        children: [
                          Container(
                            width: 100,
                            height: 100,
                            decoration: BoxDecoration(
                              color: const Color(0xFF4A90E2).withOpacity(0.1),
                              shape: BoxShape.circle,
                            ),
                            child: const Icon(
                              Icons.language,
                              size: 50,
                              color: Color(0xFF4A90E2),
                            ),
                          ),
                          const SizedBox(height: 32),
                          Text(
                            '$APP_NAME_ESC',
                            style: const TextStyle(
                              fontSize: 22,
                              fontWeight: FontWeight.bold,
                              color: Color(0xFF2C3E50),
                            ),
                            textAlign: TextAlign.center,
                          ),
                          const SizedBox(height: 8),
                          const Text(
                            'Memuat aplikasi...',
                            style: TextStyle(
                              fontSize: 14,
                              color: Colors.grey,
                            ),
                          ),
                          const SizedBox(height: 40),
                          Row(
                            mainAxisAlignment: MainAxisAlignment.center,
                            children: [
                              _buildDot(_dot1Anim, const Color(0xFF4A90E2)),
                              _buildDot(_dot2Anim, const Color(0xFF4A90E2)),
                              _buildDot(_dot3Anim, const Color(0xFF4A90E2)),
                            ],
                          ),
                          const SizedBox(height: 48),
                        ],
                      ),
                    ),
                  ),
                ),
              );
            }
          }

          class WebViewPage extends StatefulWidget {
            const WebViewPage({super.key});
            @override
            State<WebViewPage> createState() => _WebViewPageState();
          }

          class _WebViewPageState extends State<WebViewPage> {
            late final WebViewController _controller;
            late final Connectivity _connectivity;
            StreamSubscription<List<ConnectivityResult>>? _connectivitySub;
            bool _dialogShown = false;

            @override
            void initState() {
              super.initState();
              _connectivity = Connectivity();
              _controller = WebViewController()
                ..setJavaScriptMode(JavaScriptMode.unrestricted)
                ..setBackgroundColor(Colors.white)
                ..setNavigationDelegate(NavigationDelegate(
                  onWebResourceError: (error) {
                    if (error.isForMainFrame == true) _showNoConnectionDialog();
                  },
                ))
                ..loadRequest(Uri.parse('$WEB_URL_ESC'));

              _connectivitySub = _connectivity.onConnectivityChanged.listen((results) {
                if (results.every((r) => r == ConnectivityResult.none)) {
                  _showNoConnectionDialog();
                }
              });
            }

            @override
            void dispose() {
              _connectivitySub?.cancel();
              super.dispose();
            }

            void _showNoConnectionDialog() {
              if (!mounted || _dialogShown) return;
              setState(() {
                _dialogShown = true;
              });
              showDialog(
                context: context,
                barrierDismissible: false,
                builder: (context) => AlertDialog(
                  shape: RoundedRectangleBorder(borderRadius: BorderRadius.circular(16)),
                  title: const Row(
                    children: [
                      Icon(Icons.wifi_off, color: Colors.red),
                      SizedBox(width: 8),
                      Text('Gagal Terhubung'),
                    ],
                  ),
                  content: const Text(
                    'Tidak ada koneksi internet. Periksa jaringan kamu dan coba lagi.',
                  ),
                  actions: [
                    TextButton(
                      onPressed: () {
                        Navigator.pop(context);
                        setState(() {
                          _dialogShown = false;
                        });
                        _controller.reload();
                      },
                      child: const Text('Coba Lagi'),
                    ),
                  ],
                ),
              );
            }

            @override
            Widget build(BuildContext context) {
              return PopScope(
                canPop: false,
                onPopInvokedWithResult: (didPop, result) async {
                  if (didPop) return;
                  if (await _controller.canGoBack()) {
                    await _controller.goBack();
                  } else {
                    SystemNavigator.pop();
                  }
                },
                child: Scaffold(
                  body: SafeArea(
                    child: WebViewWidget(controller: _controller),
                  ),
                ),
              );
            }
          }
          DART

          head -5 myapp/lib/main.dart
          echo "... (main.dart written successfully)"

      - name: Fix Android Permissions and App Name
        env:
          APP_NAME: ${{ github.event.inputs.app_name }}
        run: |
          set -e
          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"

          if ! grep -q 'android.permission.INTERNET' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi
          if ! grep -q 'android.permission.ACCESS_NETWORK_STATE' "$MANIFEST"; then
            sed -i '/<manifest /a\    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' "$MANIFEST"
          fi

          sed -i "s/android:label=\"[^\"]*\"/android:label=\"${APP_NAME//\"/\\\"}\"/" "$MANIFEST"

          if ! grep -q 'usesCleartextTraffic\|networkSecurityConfig' "$MANIFEST"; then
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
          fi

          echo "=== AndroidManifest.xml ==="
          cat "$MANIFEST"

      - name: Setup Network Security Config
        run: |
          set -e
          mkdir -p myapp/android/app/src/main/res/xml
          cat > myapp/android/app/src/main/res/xml/network_security_config.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
            <base-config cleartextTrafficPermitted="true">
              <trust-anchors>
                <certificates src="system"/>
              </trust-anchors>
            </base-config>
          </network-security-config>
          EOF

          MANIFEST="myapp/android/app/src/main/AndroidManifest.xml"
          if ! grep -q 'networkSecurityConfig' "$MANIFEST"; then
            sed -i 's/<application/<application android:networkSecurityConfig="@xml\/network_security_config"/' "$MANIFEST"
          fi

      - name: Download and Sanitize Icon
        run: |
          set -e
          mkdir -p myapp/assets/icon
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick

          ICON_URL="${{ github.event.inputs.icon_url }}"
          echo "Downloading icon from: $ICON_URL"

          DOWNLOAD_OK=0
          if [[ "$ICON_URL" == *"github"* ]] || [[ "$ICON_URL" == *"githubusercontent"* ]]; then
            if curl -L --fail --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/octet-stream" \
              "$ICON_URL" \
              -o myapp/assets/icon/icon_raw; then
              DOWNLOAD_OK=1
            elif curl -L --fail --retry 3 --retry-delay 2 \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              "$ICON_URL" \
              -o myapp/assets/icon/icon_raw; then
              DOWNLOAD_OK=1
            fi
          fi

          if [ $DOWNLOAD_OK -eq 0 ]; then
            curl -L --fail --retry 3 --retry-delay 2 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              "$ICON_URL" \
              -o myapp/assets/icon/icon_raw || true
          fi

          if [ ! -s myapp/assets/icon/icon_raw ]; then
            echo "::warning::Icon download gagal / file kosong. Menggunakan icon default."
            convert -size 1024x1024 xc:'#4A90E2' myapp/assets/icon/icon.png
          else
            convert myapp/assets/icon/icon_raw \
              -background transparent \
              -gravity center \
              -resize 1024x1024 \
              -extent 1024x1024 \
              myapp/assets/icon/icon.png || {
                echo "::warning::Gagal convert icon. Menggunakan placeholder."
                convert -size 1024x1024 xc:'#4A90E2' myapp/assets/icon/icon.png
              }
          fi

          ls -la myapp/assets/icon/
          file myapp/assets/icon/icon.png || true

      - name: Generate Launcher Icons
        run: |
          set -e
          cd myapp
          cat > flutter_launcher_icons.yaml << 'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            min_sdk_android: 21
            adaptive_icon_background: "#FFFFFF"
            adaptive_icon_foreground: "assets/icon/icon.png"
          EOF
          dart run flutter_launcher_icons -f flutter_launcher_icons.yaml

      - name: Build APK (Release)
        run: |
          set -e
          cd myapp
          flutter pub get
          flutter build apk --release --no-tree-shake-icons
          ls -lh build/app/outputs/flutter-apk/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web2apk-release
          path: myapp/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 5
